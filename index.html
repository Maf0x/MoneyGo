<script>
'use strict';
/* 05 · State, local dates and currency — no network requests */
const $ = (s,root=document)=>root.querySelector(s);
const icons={Alimentación:'food',Transporte:'car',Compras:'bag',Entretenimiento:'play',Educación:'book',Salud:'health',Vivienda:'home',Servicios:'bolt',Otros:'more',Sueldo:'briefcase',Regalos:'gift',Ventas:'bag',Trabajos:'briefcase','Otros ingresos':'wallet'};
const defaults={expense:['Alimentación','Transporte','Compras','Entretenimiento','Educación','Salud','Vivienda','Servicios','Otros'],income:['Sueldo','Regalos','Ventas','Trabajos','Otros ingresos']};
const navItems=[['home','Inicio','home'],['transactions','Movimientos','transactions'],['stats','Estadísticas','chart'],['budgets','Presupuestos','wallet'],['settings','Ajustes','settings']];
const today=()=>dateKey(new Date());
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function localDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function addDays(s,n){const d=localDate(s);d.setDate(d.getDate()+n);return dateKey(d)}
const monthKey=(d=today())=>d.slice(0,7);
function monthOffset(n,month=monthKey()){const [y,m]=month.split('-').map(Number);return dateKey(new Date(y,m-1+n,1,12)).slice(0,7)}
function dateText(d,options={day:'numeric',month:'short'}){return localDate(d).toLocaleDateString('es-CL',options)}
function monthText(m){return dateText(m+'-01',{month:'long',year:'numeric'})}
function freshState(){return {version:1,settings:{name:'',theme:'auto',currency:'CLP',animations:true,initialBalance:0,initialDate:today(),onboarded:false},categories:structuredClone(defaults),transactions:[],budgets:[],goals:[],transfers:[]}}
let state=freshState(),db,storageReady=false,page='home',statsPeriod='month',budgetMonth=monthKey(),busy=false,hideBalance=false,previousFocus=null;
let filters={search:'',type:'all',category:'all',from:'',to:'',sort:'date-desc'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const id=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
function money(n){return new Intl.NumberFormat('es-CL',{style:'currency',currency:state.settings.currency,maximumFractionDigits:state.settings.currency==='CLP'?0:2}).format(n)}
const amountStep=()=>state.settings.currency==='CLP'?'1':'0.01';
function positiveAmount(v){const n=Number(v);if(!Number.isFinite(n)||n<=0||n>1e12)throw Error('Ingresa un monto mayor que cero y menor o igual a un billón.');if(Math.abs(n*100-Math.round(n*100))>0.001)throw Error('Usa como máximo dos decimales.');if(state.settings.currency==='CLP'&&!Number.isInteger(n))throw Error('Los montos en CLP deben ser enteros.');return n}
const sum=arr=>arr.reduce((a,n)=>a+n,0);
const signed=t=>t.type==='income'?t.amount:-t.amount;
function totalBalance(){return state.settings.initialBalance+sum(state.transactions.map(signed))}
function goalBalance(goalId){return sum(state.transfers.filter(t=>t.goalId===goalId).map(t=>t.direction==='deposit'?t.amount:-t.amount))}
function reserved(){return sum(state.goals.map(g=>goalBalance(g.id)))}
function availableBalance(){return totalBalance()-reserved()}
function periodTotals(txs){return {income:sum(txs.filter(t=>t.type==='income').map(t=>t.amount)),expense:sum(txs.filter(t=>t.type==='expense').map(t=>t.amount))}}
function monthTransactions(m=monthKey()){return state.transactions.filter(t=>t.date.startsWith(m))}
function categoryOptions(type,selected=''){return state.categories[type].map(c=>`<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`).join('')}
function toast(message,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=message;$('#toasts').append(el);setTimeout(()=>el.remove(),4500)}
/* 06 · IndexedDB: one atomic document, transactional writes */
async function openStorage(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('Este navegador no permite IndexedDB.'));const req=indexedDB.open('moneygo-private',1);req.onupgradeneeded=()=>req.result.createObjectStore('documents');req.onsuccess=()=>{db=req.result;db.onversionchange=()=>{db.close();storageReady=false;storageError('La base de datos cambió en otra pestaña. Recarga esta página.');};resolve()};req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('Cierra otras pestañas de MoneyGo y vuelve a intentarlo.'))})}
async function loadState(){return new Promise((resolve,reject)=>{const tx=db.transaction('documents','readonly');const req=tx.objectStore('documents').get('state');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function saveState(next){return new Promise((resolve,reject)=>{if(!storageReady)return reject(Error('El almacenamiento no está disponible. No se guardó ningún cambio.'));const tx=db.transaction('documents','readwrite');tx.objectStore('documents').put(next,'state');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||Error('No se pudo guardar.'));tx.onabort=()=>reject(tx.error||Error('La escritura fue cancelada.'))})}
function storageError(message){const el=$('#storage-error');el.textContent=message;el.classList.remove('hidden')}
const channel=typeof BroadcastChannel!=='undefined'?new BroadcastChannel('moneygo-changes'):null;
channel?.addEventListener('message',()=>{storageReady=false;storageError('MoneyGo cambió en otra pestaña. Recarga para continuar con los datos más recientes.');});
async function commit(mutator,message){if(busy)return false;busy=true;document.querySelectorAll('#sheet button[type=submit]').forEach(b=>b.disabled=true);try{const next=structuredClone(state);mutator(next);validateState(next);await saveState(next);state=next;channel?.postMessage('updated');applyTheme();render();if(message)toast(message);return true}catch(e){const error=$('#form-error');if(error)error.textContent=e.message;else toast(e.message||'No se pudo guardar el cambio.',true);return false}finally{busy=false;document.querySelectorAll('#sheet button[type=submit]').forEach(b=>b.disabled=false)}}
/* 07 · Import validation, referential integrity and safe backups */
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&s>='1900-01-01'&&s<='2100-12-31'&&dateKey(localDate(s))===s}
function assert(ok,message='La copia de seguridad contiene datos inválidos.'){if(!ok)throw Error(message)}
function validNumber(n,zero=false){return typeof n==='number'&&Number.isFinite(n)&&n<=(1e12)&&n>=(zero?0:0.01)&&Math.abs(n*100-Math.round(n*100))<.001}
function validString(s,max=120){return typeof s==='string'&&s.trim().length>0&&s.length<=max}
function validateState(s){assert(s&&s.version===1,'El archivo no es una copia compatible de MoneyGo (versión 1).');const st=s.settings;assert(st&&typeof st.name==='string'&&st.name.length<=50&&['light','dark','auto'].includes(st.theme)&&['CLP','USD','EUR'].includes(st.currency)&&typeof st.animations==='boolean'&&typeof st.onboarded==='boolean'&&validNumber(st.initialBalance,true)&&validDate(st.initialDate));assert(s.categories&&['expense','income'].every(t=>Array.isArray(s.categories[t])&&s.categories[t].length>0&&s.categories[t].length<=200&&new Set(s.categories[t]).size===s.categories[t].length&&s.categories[t].every(c=>validString(c,50))));for(const key of ['transactions','budgets','goals','transfers']){assert(Array.isArray(s[key])&&s[key].length<=50000);assert(new Set(s[key].map(v=>v.id)).size===s[key].length);assert(s[key].every(v=>v&&validString(v.id,100)))}
for(const t of s.transactions){assert(['income','expense'].includes(t.type)&&validNumber(t.amount)&&validString(t.description)&&s.categories[t.type].includes(t.category)&&validDate(t.date)&&t.date<=today()&&typeof t.note==='string'&&t.note.length<=1000)}
const bk=new Set();for(const b of s.budgets){assert(validNumber(b.limit)&&typeof b.month==='string'&&/^\d{4}-(0[1-9]|1[0-2])$/.test(b.month)&&b.month>='1900-01'&&b.month<='2100-12'&&s.categories.expense.includes(b.category));assert(!bk.has(b.month+'|'+b.category),'Hay presupuestos duplicados para el mismo mes y categoría.');bk.add(b.month+'|'+b.category)}
for(const g of s.goals)assert(validString(g.name,80)&&validNumber(g.target)&&(!g.date||validDate(g.date)));
const balances={};for(const t of s.transfers){assert(s.goals.some(g=>g.id===t.goalId)&&['deposit','withdraw'].includes(t.direction)&&validNumber(t.amount)&&validDate(t.date)&&t.date<=today());balances[t.goalId]=(balances[t.goalId]||0)+(t.direction==='deposit'?t.amount:-t.amount);assert(balances[t.goalId]>=-0.001,'Una meta tiene retiros superiores a sus aportes.')}return s}
function cleanImport(raw){const input=raw?.app==='MoneyGo'?raw.data:raw;validateState(input);return {version:1,settings:{name:input.settings.name,theme:input.settings.theme,currency:input.settings.currency,animations:input.settings.animations,initialBalance:input.settings.initialBalance,initialDate:input.settings.initialDate,onboarded:input.settings.onboarded},categories:{expense:[...input.categories.expense],income:[...input.categories.income]},transactions:input.transactions.map(t=>({id:t.id,type:t.type,amount:t.amount,description:t.description,category:t.category,date:t.date,note:t.note})),budgets:input.budgets.map(b=>({id:b.id,month:b.month,category:b.category,limit:b.limit})),goals:input.goals.map(g=>({id:g.id,name:g.name,target:g.target,date:g.date||''})),transfers:input.transfers.map(t=>({id:t.id,goalId:t.goalId,direction:t.direction,amount:t.amount,date:t.date}))}}
function downloadFile(content,type,name){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function exportJSON(){downloadFile(JSON.stringify({app:'MoneyGo',exportedAt:new Date().toISOString(),data:state},null,2),'application/json',`MoneyGo-respaldo-${today()}.json`);toast('Copia de seguridad preparada.')}
function csvCell(v){let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function exportCSV(){const rows=[['Fecha','Tipo','Descripción','Categoría','Monto','Moneda','Nota'],...state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>[t.date,t.type==='income'?'Ingreso':'Gasto',t.description,t.category,t.amount,state.settings.currency,t.note])];downloadFile('\uFEFF'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8',`MoneyGo-movimientos-${today()}.csv`);toast('Archivo CSV preparado.')}
/* 08 · Theme, navigation and rendering */
const themeQuery=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){const dark=state.settings.theme==='dark'||(state.settings.theme==='auto'&&themeQuery.matches);document.documentElement.classList.toggle('dark',dark);document.documentElement.classList.toggle('no-motion',!state.settings.animations);$('meta[name=theme-color]').content=dark?'#131518':'#f6f7f9'}
themeQuery.addEventListener?.('change',applyTheme);
function navMarkup(){return navItems.map(([key,label,ic])=>`<button class="nav-item ${page===key?'active':''}" data-action="navigate" data-page="${key}" ${page===key?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('')}
function navigate(next){if(!navItems.some(n=>n[0]===next))return;page=next;render();window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true})}
function heading(title,sub,right=''){return `<div class="page-heading"><div><h1>${title}</h1><p class="subtitle">${sub}</p></div>${right}</div>`}
function empty(title,body,action='transaction',button='Agregar movimiento',ic='transactions'){return `<div class="empty"><div class="badge-icon">${icon(ic)}</div><h3>${title}</h3><p>${body}</p>${action?`<button class="button secondary" data-action="${action}">${icon('plus')}${button}</button>`:''}</div>`}
function render(){const initials=state.settings.name.trim().split(/\s+/).slice(0,2).map(n=>n[0]).join('').toUpperCase()||'TÚ';$('#avatar').textContent=initials;$('#desktop-nav').innerHTML=navMarkup();$('#mobile-nav').innerHTML=navMarkup();$('#crumb').textContent=page==='home'?'Resumen':navItems.find(n=>n[0]===page)?.[1];$('#fab').classList.toggle('hidden',page==='settings');const views={home:renderHome,transactions:renderHistory,stats:renderStats,budgets:renderBudgets,settings:renderSettings};$('#main').innerHTML=`<section class="page" aria-label="${navItems.find(n=>n[0]===page)[1]}">${views[page]()}</section>`;if(page==='home')updateLineChart();if(page==='stats')updateCharts()}
function txMarkup(t){return `<button class="tx-row ${t.type}" data-action="edit-transaction" data-id="${esc(t.id)}" aria-label="Editar ${esc(t.description)}, ${t.type==='income'?'ingreso':'gasto'} ${esc(money(t.amount))}"><span class="badge-icon">${icon(icons[t.category]||(t.type==='income'?'arrow-down':'bag'))}</span><span class="grow"><span class="tx-name" style="display:block">${esc(t.description)}</span><span class="tx-meta" style="display:block">${esc(t.category)} · ${dateText(t.date)}</span></span><span class="tx-money ${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'−'}${money(t.amount)}</span></button>`}
function renderHome(){const current=periodTotals(monthTransactions());const prev=periodTotals(monthTransactions(monthOffset(-1)));const diff=current.income-current.expense-(prev.income-prev.expense);const recent=state.transactions.slice().reverse().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);const firstName=esc(state.settings.name.trim().split(/\s/)[0]||'');const hour=new Date().getHours();const greeting=hour<12?'Buenos días':hour<20?'Buenas tardes':'Buenas noches';const reserve=reserved();return `${heading(`${greeting}${firstName?', '+firstName:''} <span style="font-weight:400;color:var(--muted)">↗</span>`,'Un poco de claridad para tu tranquilidad.',`<div class="date-chip">${icon('calendar')}${new Date().toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'})}</div>`)}
${!state.settings.onboarded?`<div class="welcome"><div class="badge-icon">${icon('wallet')}</div><div class="grow"><h3>Tu próximo buen hábito empieza aquí.</h3><p>Personaliza tu espacio e indica con cuánto empiezas.</p></div><button class="button" data-action="onboard">Comenzar ${icon('chevron')}</button></div>`:''}
<div class="dashboard-grid"><div class="main-column"><article class="balance-card"><div class="balance-top"><div><span class="label">Saldo disponible</span><div class="balance-amount mono">${hideBalance?'••••••':money(availableBalance())}<span class="currency-label">${state.settings.currency}</span></div><div class="balance-foot">${reserve?`${money(reserve)} reservado en metas · Total ${money(totalBalance())}`:'Todo tu dinero, en un solo lugar.'}</div></div><button class="icon-button" data-action="toggle-balance" aria-label="${hideBalance?'Mostrar':'Ocultar'} saldo" aria-pressed="${hideBalance}">${icon('eye')}</button></div><div class="divider"></div><div class="balance-metrics"><div><div class="metric-name">${icon('arrow-down','positive')}Ingresos del mes</div><div class="metric-amount mono">${hideBalance?'••••':money(current.income)}</div></div><div><div class="metric-name">${icon('arrow-up','negative')}Gastos del mes</div><div class="metric-amount mono">${hideBalance?'••••':money(current.expense)}</div></div></div></article>
<article class="card"><div class="card-head"><div><h2>Tu dinero en el tiempo</h2><p class="subtitle">Saldo total · últimos 7 días</p></div><span class="pill">Esta semana</span></div><div id="balance-chart"></div></article>
<article class="card"><div class="card-head" style="margin-bottom:6px"><h2>Últimos movimientos</h2><button class="text-button" data-action="navigate" data-page="transactions">Ver todos ${icon('chevron')}</button></div><div class="tx-list">${recent.length?recent.map(txMarkup).join(''):empty('Tu historia empieza en cero','Registra tu primer ingreso o gasto y empieza a conocer tu dinero.')}</div></article></div>
<div class="side-column"><article class="card"><div class="card-head"><h2>Este mes, en resumen</h2>${icon('chart')}</div><div class="mini-summary"><div><span class="label">Ahorro neto</span><strong class="mono ${current.income-current.expense<0?'negative':''}">${money(current.income-current.expense)}</strong></div><div><span class="label">Tasa de ahorro</span><strong class="mono">${current.income?Math.round((current.income-current.expense)/current.income*100)+'%':'—'}</strong></div></div><div class="divider"></div><div class="row" style="align-items:flex-start"><div class="badge-icon" style="width:33px;height:33px;border-radius:10px">${icon(diff>=0?'arrow-up':'arrow-down')}</div><p class="small muted"><strong style="color:var(--ink);font-weight:550">${diff===0?'Sin diferencia':(diff>0?'+':'−')+money(Math.abs(diff))}</strong><br>en ahorro neto frente al mes anterior completo.</p></div></article>
<article class="card"><div class="card-head"><h2>Tus metas, más cerca</h2><span class="badge-icon" style="width:33px;height:33px;border-radius:10px">${icon('target')}</span></div>${state.goals.length?state.goals.slice(0,2).map(goalPreview).join(''):empty('Dale un propósito a tu ahorro','Un viaje, tu próximo proyecto o un poco de tranquilidad.','goal','Crear una meta','target')}<button class="text-button" data-action="navigate" data-page="budgets" style="width:100%;justify-content:space-between;margin-top:10px">Explorar metas y presupuestos ${icon('chevron')}</button></article>
<article class="notice">${icon('shield')}<p>Tu información es solo tuya. Exporta un respaldo de vez en cuando para mantenerla a salvo.</p></article></div></div>`}
function goalPreview(g){const amount=goalBalance(g.id),percent=Math.min(100,Math.round(amount/g.target*100));return `<button class="goal-preview" style="width:100%;text-align:left" data-action="goal-detail" data-id="${esc(g.id)}"><div class="goal-head"><span class="badge-icon">${icon('target')}</span><div class="grow"><h3>${esc(g.name)}</h3><span class="small muted">${percent}% completado</span></div></div><div class="progress"><span style="width:${percent}%"></span></div><div class="goal-values"><span>${money(amount)}</span><span>de ${money(g.target)}</span></div></button>`}
/* 09 · Interactive SVG balance chart */
function updateLineChart(){const dates=Array.from({length:7},(_,i)=>addDays(today(),i-6));const vals=dates.map(d=>(d>=state.settings.initialDate?state.settings.initialBalance:0)+sum(state.transactions.filter(t=>t.date<=d).map(signed)));const min=Math.min(0,...vals),max=Math.max(0,...vals),range=max-min||1;const x=i=>12+i*76,y=v=>132-(v-min)/range*112;const points=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');$('#balance-chart').innerHTML=`<div class="chart-labels"><span>${money(max)}</span><span>${money(min)}</span></div><svg class="line-chart" viewBox="0 0 480 155" role="group" aria-label="Saldo total de los últimos siete días"><path d="M12 20H468M12 76H468M12 132H468" stroke="var(--line)" stroke-dasharray="3 5" fill="none"/><path d="M12 145 L${points.replace(/ /g,' L')} L468 145 Z" fill="var(--soft)"/><polyline points="${points}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>${vals.map((v,i)=>`<g tabindex="0" role="button" aria-label="${dateText(dates[i])}: ${money(v)}" data-chart-value="${esc(dateText(dates[i])+': '+money(v))}"><rect x="${x(i)-22}" y="0" width="44" height="155" fill="transparent"/><circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/></g>`).join('')}</svg><div class="chart-axis">${dates.map(d=>`<span>${dateText(d,{weekday:'short'})}</span>`).join('')}</div><div class="chart-tooltip" id="line-tooltip" aria-live="polite">Toca un punto para ver el saldo de ese día.</div>`}
/* 10 · Transaction history and filters */
function filteredTransactions(){return state.transactions.filter(t=>(!filters.search||(t.description+' '+t.note+' '+t.category).toLocaleLowerCase('es').includes(filters.search.toLocaleLowerCase('es')))&&(filters.type==='all'||filters.type===t.type)&&(filters.category==='all'||filters.category===t.category)&&(!filters.from||t.date>=filters.from)&&(!filters.to||t.date<=filters.to)).slice().reverse().sort((a,b)=>filters.sort==='amount-desc'?b.amount-a.amount:filters.sort==='amount-asc'?a.amount-b.amount:filters.sort==='date-asc'?a.date.localeCompare(b.date):b.date.localeCompare(a.date))}
function renderHistory(){const cats=[...new Set([...state.categories.expense,...state.categories.income])];return `${heading('Tus movimientos','Cada movimiento cuenta. Aquí están todos.')}
<div class="card"><div class="filters"><div class="search-field">${icon('search')}<input id="search" aria-label="Buscar movimientos" placeholder="Buscar un movimiento…" value="${esc(filters.search)}" autocomplete="off"></div><select id="filter-type" aria-label="Filtrar por tipo"><option value="all">Todos los tipos</option><option value="income" ${filters.type==='income'?'selected':''}>Ingresos</option><option value="expense" ${filters.type==='expense'?'selected':''}>Gastos</option></select><select id="filter-category" aria-label="Filtrar por categoría"><option value="all">Todas las categorías</option>${cats.map(c=>`<option ${filters.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="filter-dates"><div class="field"><label for="filter-from">Desde</label><input type="date" id="filter-from" value="${filters.from}"></div><div class="field"><label for="filter-to">Hasta</label><input type="date" id="filter-to" value="${filters.to}"></div><div class="field"><label for="filter-sort">Ordenar por</label><select id="filter-sort">${[['date-desc','Más recientes'],['date-asc','Más antiguos'],['amount-desc','Mayor monto'],['amount-asc','Menor monto']].map(([v,l])=>`<option value="${v}" ${filters.sort===v?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="row between" style="margin-top:10px"><span id="filter-warning" class="small negative"></span><button class="text-button" data-action="reset-filters">Limpiar filtros</button></div><div id="history-total"></div></div><div id="history-results" style="margin-top:23px" aria-live="polite"></div>`}
function renderHistoryResults(){const txs=filteredTransactions();const total=periodTotals(txs);$('#history-total').innerHTML=`<div class="period-total"><div><span class="label">${txs.length} movimientos · saldo del período</span><strong class="mono">${money(total.income-total.expense)}</strong></div><div><span class="label">Ingresos</span><strong class="positive mono">${money(total.income)}</strong></div><div><span class="label">Gastos</span><strong class="negative mono">${money(total.expense)}</strong></div></div>`;$('#filter-warning').textContent=filters.from&&filters.to&&filters.from>filters.to?'La fecha inicial debe ser anterior a la final.':'';if(!txs.length){$('#history-results').innerHTML=`<div class="card">${empty(state.transactions.length?'No encontramos movimientos':'Un nuevo comienzo',state.transactions.length?'Prueba con otras fechas, categorías o palabras.':'Tu primer movimiento es el primer paso hacia el control de tus finanzas.')}</div>`;return}let last='';$('#history-results').innerHTML=`<div class="card">${txs.map(t=>{const title=last!==t.date?`<h3 class="date-group">${dateText(t.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h3>`:'';last=t.date;return title+txMarkup(t)}).join('')}</div>`}
/* 11 · Statistics: time ranges, category distribution & six months */
function statsRange(){const d=today();if(statsPeriod==='week')return {from:addDays(d,-6),to:d,label:'Últimos 7 días',days:7};if(statsPeriod==='year')return {from:d.slice(0,4)+'-01-01',to:d,label:'Este año',days:Math.round((localDate(d)-localDate(d.slice(0,4)+'-01-01'))/86400000)+1};return {from:monthKey()+'-01',to:d,label:'Este mes',days:localDate(d).getDate()}}
function calculateStatistics(){const range=statsRange();const txs=state.transactions.filter(t=>t.date>=range.from&&t.date<=range.to);const totals=periodTotals(txs);const categories={};txs.filter(t=>t.type==='expense').forEach(t=>categories[t.category]=(categories[t.category]||0)+t.amount);const cats=Object.entries(categories).sort((a,b)=>b[1]-a[1]);return {...totals,categories:cats,range,saving:totals.income-totals.expense,average:totals.expense/range.days}}
function renderStats(){const s=calculateStatistics();return `<div class="page-heading stats-heading"><div><h1>Una mirada más clara</h1><p class="subtitle">Entiende tus hábitos. Decide con confianza.</p></div><div class="segment" aria-label="Período de análisis">${[['week','Semanal'],['month','Mensual'],['year','Anual']].map(([v,l])=>`<button data-action="stats-period" data-value="${v}" class="${statsPeriod===v?'selected':''}" aria-pressed="${statsPeriod===v}">${l}</button>`).join('')}</div></div><div class="two-columns"><article class="card"><div class="card-head"><h2>¿En qué se va tu dinero?</h2><span class="pill">${s.range.label}</span></div><div id="donut-chart"></div></article><article class="card"><div class="card-head"><div><h2>Ingresos y gastos</h2><p class="subtitle">Últimos 6 meses · hasta hoy</p></div></div><div class="row small muted" style="gap:18px"><span class="row" style="gap:6px"><span class="dot" style="background:var(--ink)"></span>Ingresos</span><span class="row" style="gap:6px"><span class="dot" style="background:#b6bbc5"></span>Gastos</span></div><div id="bar-chart"></div></article></div><div class="stats-grid">${[['Total ganado',money(s.income),'positive'],['Total gastado',money(s.expense),'negative'],['Dinero ahorrado',money(s.saving),s.saving<0?'negative':''],['Mayor gasto',s.categories[0]?.[0]||'Sin gastos',''],['Promedio diario',money(s.average),''],['Movimientos',String(state.transactions.filter(t=>t.date>=s.range.from&&t.date<=s.range.to).length),'']].map(([label,value,cls])=>`<article class="card stat"><span class="label">${label}</span><strong class="${cls} mono">${value}</strong></article>`).join('')}</div><p class="small muted" style="margin-top:18px">Resumen de ${dateText(s.range.from)} a ${dateText(s.range.to)}. El ahorro neto es la diferencia entre ingresos y gastos; los aportes a metas son transferencias internas.</p>`}
const chartColors=['#333740','#767e8b','#a9afb8','#c4c8ce','#565c69','#9299a4','#d4d7dc','#656b77','#b8bec8'];
function updateCharts(){const s=calculateStatistics();if(!s.expense){$('#donut-chart').innerHTML=empty('Todavía no hay gastos','Cuando registres un gasto, verás aquí cómo se distribuye tu dinero.','','','chart')}else{let offset=0;const rings=s.categories.map(([c,a],i)=>{const n=a/s.expense*100;const code=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${chartColors[i%chartColors.length]}" stroke-width="5" stroke-dasharray="${n} ${100-n}" stroke-dashoffset="${-offset}" tabindex="0" role="button" aria-label="${esc(c)}: ${money(a)}, ${Math.round(n)} por ciento" data-category-value="${esc(c)}"/>`;offset+=n;return code}).join('');$('#donut-chart').innerHTML=`<div class="donut-area"><svg viewBox="0 0 42 42" role="group" aria-label="Distribución de gastos">${rings}</svg><div class="donut-center"><span id="donut-label">Gastos totales</span><strong id="donut-value" class="mono">${money(s.expense)}</strong></div></div><div class="legend">${s.categories.map(([c,a],i)=>`<button data-action="chart-category" data-category="${esc(c)}"><span class="dot" style="background:${chartColors[i%chartColors.length]}"></span><span class="grow small">${esc(c)}</span><span class="small mono">${money(a)}</span><span class="small muted" style="min-width:31px;text-align:right">${Math.round(a/s.expense*100)}%</span></button>`).join('')}</div>`}const months=Array.from({length:6},(_,i)=>monthOffset(i-5));const values=months.map(m=>periodTotals(monthTransactions(m)));const max=Math.max(1,...values.flatMap(v=>[v.income,v.expense]));$('#bar-chart').innerHTML=`<div class="bars" role="group" aria-label="Comparación mensual de ingresos y gastos">${values.map((v,i)=>`<div class="bar-group"><button aria-label="${monthText(months[i])}: ingresos ${money(v.income)}" data-action="chart-bar" data-value="${esc(monthText(months[i])+': ingresos '+money(v.income))}" style="height:${Math.max(2,v.income/max*100)}%"></button><button class="expense-bar" aria-label="${monthText(months[i])}: gastos ${money(v.expense)}" data-action="chart-bar" data-value="${esc(monthText(months[i])+': gastos '+money(v.expense))}" style="height:${Math.max(2,v.expense/max*100)}%"></button></div>`).join('')}</div><div class="bar-months">${months.map(m=>`<span>${dateText(m+'-01',{month:'short'})}</span>`).join('')}</div><div class="chart-tooltip" id="bar-tooltip" aria-live="polite">Toca una barra para ver el detalle.</div>`}
function selectChartCategory(cat){const s=calculateStatistics();const amount=s.categories.find(([c])=>c===cat)?.[1];if(amount===undefined)return;$('#donut-label').textContent=cat;$('#donut-value').textContent=money(amount);document.querySelectorAll('[data-action=chart-category]').forEach(el=>el.classList.toggle('selected',el.dataset.category===cat))}
/* 12 · Monthly budgets and savings goals */
function budgetSpent(b){return sum(state.transactions.filter(t=>t.type==='expense'&&t.category===b.category&&t.date.startsWith(b.month)).map(t=>t.amount))}
function renderBudgets(){const budgets=state.budgets.filter(b=>b.month===budgetMonth);const spent=sum(budgets.map(b=>budgetSpent(b)));const limit=sum(budgets.map(b=>b.limit));return `${heading('Un plan para tu dinero','Pequeños límites. Grandes posibilidades.',`<button class="button" data-action="budget">${icon('plus')}Presupuesto</button>`)}<div class="row between wrap" style="margin-bottom:20px"><div><h2>Presupuestos mensuales</h2><p class="subtitle">${money(spent)} gastados de ${money(limit)} planificados</p></div><input class="budget-month" type="month" id="budget-month" aria-label="Mes de presupuestos" value="${budgetMonth}" min="1900-01" max="2100-12"></div>${budgets.length?`<div class="three-columns">${budgets.map(b=>{const value=budgetSpent(b),pct=value/b.limit*100;return `<article class="card budget-card"><div class="row between"><div class="row"><span class="badge-icon">${icon(icons[b.category]||'wallet')}</span><h3>${esc(b.category)}</h3></div><button class="icon-button" style="border:0;width:32px;height:32px" data-action="edit-budget" data-id="${esc(b.id)}" aria-label="Editar presupuesto de ${esc(b.category)}">${icon('more')}</button></div><div class="budget-amount mono">${money(value)} <span class="small muted">/ ${money(b.limit)}</span></div><div class="progress ${pct>=100?'over':pct>=80?'warn':''}" role="progressbar" aria-label="Presupuesto de ${esc(b.category)}" aria-valuenow="${Math.round(Math.min(100,pct))}" aria-valuemin="0" aria-valuemax="100"><span style="width:${Math.min(100,pct)}%"></span></div><div class="goal-values"><span>${pct.toFixed(0)}% utilizado</span><span>${value>b.limit?'Excedido en '+money(value-b.limit):'Disponible '+money(b.limit-value)}</span></div>${pct>=80?`<div class="alert ${pct<100?'warning':''}">${pct>=100?'Alcanzaste el límite de este presupuesto.':'Has utilizado el 80% o más. Aún puedes ajustar el rumbo.'}</div>`:''}</article>`}).join('')}</div>`:`<div class="card">${empty('Un mes con intención',`Define cuánto quieres gastar por categoría en ${esc(monthText(budgetMonth))}.`,'budget','Crear presupuesto','wallet')}${state.budgets.some(b=>b.month===monthOffset(-1,budgetMonth))?'<button class="button outline" style="width:100%" data-action="copy-budgets">Copiar límites del mes anterior</button>':''}</div>`}<div class="row between goals-header"><div><h2>Metas de ahorro</h2><p class="subtitle">Dinero con un propósito.</p></div><button class="text-button" data-action="goal">${icon('plus')}Nueva meta</button></div>${state.goals.length?`<div class="three-columns">${state.goals.map(g=>{const amount=goalBalance(g.id),pct=amount/g.target*100;return `<article class="card goal-card"><div class="row between"><span class="badge-icon">${icon('target')}</span>${pct>=100?'<span class="completed">Meta alcanzada</span>':''}<button class="icon-button" style="border:0;width:32px;height:32px" data-action="edit-goal" data-id="${esc(g.id)}" aria-label="Editar meta ${esc(g.name)}">${icon('more')}</button></div><h3 style="margin-top:18px">${esc(g.name)}</h3><p class="small muted" style="margin-top:4px">${g.date?'Objetivo: '+dateText(g.date,{day:'numeric',month:'short',year:'numeric'}):'A tu propio ritmo'}</p><div class="goal-amount mono">${money(amount)} <small>de ${money(g.target)}</small></div><div class="progress" role="progressbar" aria-label="${esc(g.name)}" aria-valuenow="${Math.min(100,Math.round(pct))}" aria-valuemin="0" aria-valuemax="100"><span style="width:${Math.min(100,pct)}%"></span></div><span class="small muted">${Math.floor(pct)}% completado</span><button class="button secondary" style="width:100%" data-action="goal-detail" data-id="${esc(g.id)}">Administrar ahorro ${icon('chevron')}</button></article>`}).join('')}</div>`:`<div class="card">${empty('¿Qué te gustaría hacer realidad?','Crea una meta y separa dinero para eso que te importa.','goal','Crear mi primera meta','target')}</div>`}<div class="notice" style="margin-top:23px">${icon('info')}<p>Los presupuestos pertenecen a cada mes y conservan su historial. Tus metas separan dinero del saldo disponible, sin modificar el total ni generar ingresos o gastos adicionales.</p></div>`}
function budgetAlerts(before){const now=state.budgets.filter(b=>b.month===monthKey());for(const b of now){const old=before.find(v=>v.id===b.id)?.pct||0;const pct=budgetSpent(b)/b.limit;if(old<1&&pct>=1)toast(`Llegaste al 100% de tu presupuesto de ${b.category}.`);else if(old<.8&&pct>=.8)toast(`Has utilizado el 80% de tu presupuesto de ${b.category}.`)}}
/* 13 · Settings and privacy */
function renderSettings(){return `${heading('A tu manera','Tu espacio, tus preferencias. Tú tienes el control.')}<div class="settings-grid"><div class="stack"><article class="card"><h2>Tu perfil</h2><div class="settings-row"><div><h3>${esc(state.settings.name)||'Tu nombre'}</h3><p>Así te saludaremos en MoneyGo.</p></div><button class="button secondary" data-action="profile">Editar</button></div><div class="settings-row"><div><h3>Saldo inicial</h3><p>${money(state.settings.initialBalance)} · ${dateText(state.settings.initialDate)}</p></div><button class="text-button" data-action="initial">Modificar</button></div></article><article class="card"><h2>Preferencias</h2><div class="settings-row"><div><label for="setting-theme">Apariencia</label><p>Un espacio cómodo para tus ojos.</p></div><select id="setting-theme">${[['auto','Automático'],['light','Claro'],['dark','Oscuro']].map(([v,l])=>`<option value="${v}" ${state.settings.theme===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="settings-row"><div><label for="setting-currency">Moneda</label><p>Cambia la unidad, sin convertir montos.</p></div><select id="setting-currency">${[['CLP','CLP · Peso chileno'],['USD','USD · Dólar'],['EUR','EUR · Euro']].map(([v,l])=>`<option value="${v}" ${state.settings.currency===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="settings-row"><div><label for="setting-animations">Animaciones</label><p>Movimientos suaves y discretos.</p></div><input type="checkbox" id="setting-animations" ${state.settings.animations?'checked':''}></div><div class="settings-row"><div><h3>Categorías</h3><p>Crea categorías de ingreso o gasto.</p></div><button class="text-button" data-action="category">${icon('plus')}Agregar</button></div></article></div><div class="stack"><article class="card"><h2>Tus datos, siempre tuyos</h2><p class="subtitle" style="margin-bottom:22px">Guarda una copia antes de cambiar de dispositivo o borrar los datos de tu navegador.</p><div class="settings-actions"><button class="button outline" data-action="export-json">${icon('download')}Exportar copia de seguridad · JSON</button><button class="button outline" data-action="import-json">${icon('upload')}Restaurar copia de seguridad · JSON</button><button class="button outline" data-action="export-csv">${icon('download')}Exportar movimientos · CSV</button></div><div class="divider"></div><div class="notice">${icon('shield')}<p>Guardado localmente con IndexedDB. No conectamos bancos, no solicitamos contraseñas y no enviamos tu información a ningún servidor.</p></div></article><article class="card"><div class="settings-row" style="padding-top:0"><div><h3>Acerca de MoneyGo</h3><p>Tu dinero, con claridad. Versión 1.0</p></div><button class="icon-button" data-action="about" aria-label="Información y funcionamiento sin conexión">${icon('info')}</button></div><div class="settings-row"><div><h3 class="negative">Eliminar todos los datos</h3><p>Se borrarán también metas y preferencias.</p></div><button class="icon-button negative" data-action="reset" aria-label="Eliminar todos los datos">${icon('trash')}</button></div></article></div></div>`}
/* 14 · Accessible modal sheets and confirmations */
function showSheet(title,content){const dialog=$('#sheet');if(!dialog.open)previousFocus=document.activeElement;$('#sheet-title').textContent=title;$('#sheet-body').innerHTML=content;if(!dialog.open)dialog.showModal();dialog.scrollTop=0;const field=$('[autofocus]',$('#sheet-body'));if(field&&matchMedia('(min-width:701px)').matches)requestAnimationFrame(()=>field.focus())}
function closeSheet(){$('#sheet').close();previousFocus?.isConnected&&previousFocus.focus({preventScroll:true})}
function errorMarkup(){return '<p class="form-error" id="form-error" role="alert"></p>'}
function formButtons(label='Guardar',deleteAction='',itemId=''){return `${errorMarkup()}<div class="sheet-actions">${deleteAction?`<button type="button" class="button danger" data-action="${deleteAction}" data-id="${esc(itemId)}" aria-label="Eliminar">${icon('trash')}</button>`:''}<button type="submit" class="button">${icon('check')}${label}</button></div>`}
let confirmationCallback=null;
function confirmSheet(title,body,callback,label='Confirmar',danger=false){confirmationCallback=callback;showSheet(title,`<p class="muted" style="font-size:13px;margin-bottom:20px">${body}</p><div class="sheet-actions"><button class="button secondary" data-action="close">Cancelar</button><button class="button ${danger?'danger':''}" data-action="confirm">${label}</button></div>${errorMarkup()}`)}
function openTransaction(transactionId){const t=state.transactions.find(t=>t.id===transactionId);const type=t?.type||'expense';showSheet(t?'Editar movimiento':'Nuevo movimiento',`<form id="transaction-form" data-id="${esc(t?.id||'')}"><input type="hidden" name="type" value="${type}"><div class="segment" aria-label="Tipo de movimiento"><button type="button" data-action="transaction-type" data-type="expense" class="${type==='expense'?'selected':''}" aria-pressed="${type==='expense'}">${icon('arrow-up')} Gasto</button><button type="button" data-action="transaction-type" data-type="income" class="${type==='income'?'selected':''}" aria-pressed="${type==='income'}">${icon('arrow-down')} Ingreso</button></div><div class="field"><label for="tx-amount">Monto · ${state.settings.currency}</label><input class="amount-input mono" id="tx-amount" name="amount" inputmode="decimal" type="number" min="${amountStep()}" step="${amountStep()}" max="1000000000000" placeholder="0" value="${t?.amount||''}" required autofocus></div><div class="field"><label for="tx-description">Descripción</label><input id="tx-description" name="description" placeholder="¿En qué se movió tu dinero?" maxlength="120" value="${esc(t?.description||'')}" required></div><div class="fields"><div class="field"><label for="tx-category">Categoría</label><select id="tx-category" name="category">${categoryOptions(type,t?.category)}<option value="__custom__">+ Crear categoría</option></select></div><div class="field"><label for="tx-date">Fecha</label><input id="tx-date" name="date" type="date" min="1900-01-01" max="${today()}" value="${t?.date||today()}" required></div></div><div id="inline-category" class="hidden field"><label for="new-category">Nueva categoría</label><input id="new-category" name="newCategory" maxlength="50" placeholder="Nombre de la categoría"></div><div class="field"><label for="tx-note">Nota <span class="muted">· opcional</span></label><textarea id="tx-note" name="note" maxlength="1000" placeholder="Algo que quieras recordar…">${esc(t?.note||'')}</textarea></div>${formButtons(t?'Guardar cambios':'Guardar movimiento',t?'delete-transaction':'',t?.id)}</form>`)}
async function registerTransaction(form){const f=new FormData(form);const amount=positiveAmount(f.get('amount'));const type=f.get('type'),date=f.get('date'),description=f.get('description').trim();assert(description,'Escribe una descripción para tu movimiento.');assert(validDate(date)&&date<=today(),'Elige una fecha válida que no sea futura.');let category=f.get('category');const custom=category==='__custom__';if(custom){category=f.get('newCategory').trim();assert(validString(category,50),'Escribe un nombre de categoría de hasta 50 caracteres.')}const item={id:form.dataset.id||id(),type,amount,date,description,category,note:f.get('note').trim()};const before=state.budgets.map(b=>({id:b.id,pct:budgetSpent(b)/b.limit}));const ok=await commit(s=>{if(custom&&!s.categories[type].includes(category))s.categories[type].push(category);const idx=s.transactions.findIndex(t=>t.id===item.id);if(idx>=0)s.transactions[idx]=item;else s.transactions.push(item)},form.dataset.id?'Movimiento actualizado.':'Movimiento guardado.');if(ok){closeSheet();budgetAlerts(before)}}
function deleteTransaction(itemId){const t=state.transactions.find(t=>t.id===itemId);if(!t)return;confirmSheet('¿Eliminar este movimiento?',`${esc(t.description)} · ${money(t.amount)}. El saldo y las estadísticas se actualizarán. Esta acción no se puede deshacer.`,async()=>{if(await commit(s=>s.transactions=s.transactions.filter(t=>t.id!==itemId),'Movimiento eliminado.'))closeSheet()},'Eliminar movimiento',true)}
function openProfile(onboarding=false,initialOnly=false){showSheet(onboarding?'Bienvenido a MoneyGo':initialOnly?'Tu punto de partida':'Tu perfil',`<form id="profile-form" data-onboarding="${onboarding}" data-initial="${initialOnly}">${!initialOnly?`<div class="field"><label for="profile-name">¿Cómo te llamas?</label><input id="profile-name" name="name" maxlength="50" value="${esc(state.settings.name)}" placeholder="Tu nombre" autofocus></div>`:''}${onboarding||initialOnly?`<p class="small muted">Indica el dinero que tenías antes de tus movimientos registrados. Este saldo no se contará como ingreso.</p><div class="field"><label for="initial-amount">Saldo inicial · ${state.settings.currency}</label><input id="initial-amount" name="initialBalance" type="number" min="0" step="${amountStep()}" max="1000000000000" inputmode="decimal" value="${state.settings.initialBalance}" required></div><div class="field"><label for="initial-date">Fecha del saldo inicial</label><input id="initial-date" name="initialDate" type="date" min="1900-01-01" max="${today()}" value="${state.settings.initialDate}" required></div>`:''}<div class="notice">${icon('shield')}<p>Sin cuentas ni conexiones bancarias. Los datos viven en este navegador; podrían perderse si borras sus datos. Exporta una copia periódicamente.</p></div>${formButtons(onboarding?'Empezar con claridad':'Guardar')}</form>`)}
function openCategory(){showSheet('Una categoría a tu medida',`<form id="category-form"><div class="field"><label for="category-type">Tipo</label><select id="category-type" name="type"><option value="expense">Gasto</option><option value="income">Ingreso</option></select></div><div class="field"><label for="category-name">Nombre</label><input id="category-name" name="name" maxlength="50" required placeholder="Ej. Mascotas" autofocus></div>${formButtons('Crear categoría')}</form>`)}
function openBudget(budgetId){const b=state.budgets.find(b=>b.id===budgetId);showSheet(b?'Editar presupuesto':'Planifica un presupuesto',`<form id="budget-form" data-id="${esc(b?.id||'')}"><div class="fields"><div class="field"><label for="budget-category">Categoría de gasto</label><select id="budget-category" name="category">${categoryOptions('expense',b?.category)}</select></div><div class="field"><label for="budget-period">Mes</label><input id="budget-period" name="month" type="month" min="1900-01" max="2100-12" value="${b?.month||budgetMonth}" required></div></div><div class="field"><label for="budget-limit">Límite mensual · ${state.settings.currency}</label><input id="budget-limit" name="limit" type="number" inputmode="decimal" min="${amountStep()}" step="${amountStep()}" max="1000000000000" placeholder="150000" value="${b?.limit||''}" required autofocus></div><p class="small muted">El límite se aplica únicamente al mes seleccionado. Cada mes tiene su propio presupuesto y conserva su historial.</p>${formButtons('Guardar presupuesto',b?'delete-budget':'',b?.id)}</form>`)}
function openGoal(goalId){const g=state.goals.find(g=>g.id===goalId);showSheet(g?'Editar meta':'Un objetivo que te motive',`<form id="goal-form" data-id="${esc(g?.id||'')}"><div class="field"><label for="goal-name">Nombre de tu meta</label><input id="goal-name" name="name" maxlength="80" value="${esc(g?.name||'')}" placeholder="Ej. Fondo de emergencia" required autofocus></div><div class="field"><label for="goal-target">Cantidad objetivo · ${state.settings.currency}</label><input id="goal-target" name="target" type="number" min="${amountStep()}" step="${amountStep()}" max="1000000000000" inputmode="decimal" placeholder="500000" value="${g?.target||''}" required></div><div class="field"><label for="goal-date">Fecha objetivo <span class="muted">· opcional</span></label><input id="goal-date" name="date" type="date" min="1900-01-01" max="2100-12-31" value="${g?.date||''}"></div>${formButtons('Guardar meta',g?'delete-goal':'',g?.id)}</form>`)}
function openGoalDetail(goalId){const g=state.goals.find(g=>g.id===goalId);if(!g)return;const amount=goalBalance(g.id),pct=amount/g.target*100;const transfers=state.transfers.filter(t=>t.goalId===g.id).slice().reverse();showSheet(g.name,`<p class="label">Dinero reservado</p><h1 class="mono">${money(amount)} <span class="small muted">de ${money(g.target)}</span></h1><div class="progress"><span style="width:${Math.min(100,pct)}%"></span></div><p class="small muted" style="margin-bottom:22px">${Math.floor(pct)}% completado · Disponible para aportar: ${money(availableBalance())}</p><form id="transfer-form" data-id="${esc(g.id)}"><div class="fields"><div class="field"><label for="transfer-direction">Operación</label><select id="transfer-direction" name="direction"><option value="deposit">Agregar dinero</option><option value="withdraw">Retirar dinero</option></select></div><div class="field"><label for="transfer-amount">Monto · ${state.settings.currency}</label><input id="transfer-amount" name="amount" type="number" inputmode="decimal" min="${amountStep()}" step="${amountStep()}" max="1000000000000" placeholder="0" required></div></div><p class="small muted">Es una transferencia dentro de tu dinero. No crea un nuevo ingreso o gasto.</p>${formButtons('Registrar operación')}</form><div class="divider"></div><div class="row between"><h3>Operaciones de la meta</h3><button class="text-button" data-action="edit-goal" data-id="${esc(g.id)}">Editar meta</button></div>${transfers.length?transfers.map(t=>`<div class="row between" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><span class="small">${t.direction==='deposit'?'Aporte a meta':'Retiro de meta'}</span><p class="small muted">${dateText(t.date,{day:'numeric',month:'short',year:'numeric'})}</p></div><strong class="small mono">${t.direction==='deposit'?'+':'−'}${money(t.amount)}</strong></div>`).join(''):'<p class="small muted" style="margin-top:10px">Aquí aparecerán tus aportes y retiros.</p>'}`)}
async function manageTransfer(form){const f=new FormData(form),amount=positiveAmount(f.get('amount')),direction=f.get('direction'),goalId=form.dataset.id;const g=state.goals.find(g=>g.id===goalId);if(!g)throw Error('Esta meta ya no existe.');if(direction==='deposit'&&amount>availableBalance()+.001)throw Error('No tienes suficiente saldo disponible para este aporte.');if(direction==='withdraw'&&amount>goalBalance(goalId)+.001)throw Error('El retiro no puede superar el dinero de la meta.');const wasComplete=goalBalance(goalId)>=g.target;const ok=await commit(s=>s.transfers.push({id:id(),goalId,direction,amount,date:today()}),'Operación registrada.');if(ok){if(!wasComplete&&goalBalance(goalId)>=g.target){showSheet('¡Lo hiciste!',`<div class="celebration"><div class="badge-icon">${icon('check')}</div><h3>Una meta hecha realidad.</h3><p>Alcanzaste tu objetivo para <strong>${esc(g.name)}</strong>. Cada pequeño aporte te trajo hasta aquí.</p><button class="button" data-action="close">Disfrutar el logro</button></div>`)}else openGoalDetail(goalId)}}
function openImport(){showSheet('Restaurar una copia de seguridad',`<form id="import-form"><div class="notice">${icon('info')}<p>La copia reemplazará todos los datos actuales. Exporta un respaldo primero si quieres conservarlos. Solo se aceptan archivos JSON de MoneyGo, de hasta 15 MB.</p></div><div class="field"><label for="import-file">Archivo de respaldo</label><input id="import-file" name="file" type="file" accept=".json,application/json" required></div>${formButtons('Revisar archivo')}</form>`)}
function openAbout(){showSheet('MoneyGo · Tu dinero, con claridad',`<div class="about-copy"><p><strong>Versión 1.0 · Hecha para tu tranquilidad.</strong></p><p>Todos tus datos se guardan con IndexedDB en este navegador y dispositivo. MoneyGo no utiliza rastreadores, servidores, cuentas, APIs ni servicios de pago. No solicita datos ni contraseñas bancarias.</p><p><strong>Cuida tu información.</strong> Borrar los datos del navegador, usar modo privado o cambiar de dispositivo puede eliminar o aislar tus registros. Exporta copias JSON regularmente. Los archivos exportados no están cifrados: guárdalos en un lugar seguro.</p><p><strong>Un solo archivo, sin recursos externos.</strong> Mientras esta página permanezca cargada, todas sus funciones operan sin internet. También puedes guardar y abrir este HTML localmente cuando tu navegador lo permita; el almacenamiento depende del navegador y del origen desde el que lo abras.</p><p><strong>Instalación y recarga sin conexión.</strong> Este HTML por sí solo no garantiza abrir o recargar la aplicación sin red. Para una PWA instalable se requieren HTTPS (o localhost), un <code>manifest.webmanifest</code>, iconos y un <code>sw.js</code> que guarde los recursos. Un Service Worker no se puede registrar desde un script inline o una URL blob. Su primera instalación requiere conexión; después de activarse puede servir la aplicación sin red.</p><p>Los presupuestos son mensuales. Los aportes a metas se registran como transferencias internas y reducen el saldo disponible, sin alterar el saldo total. Cambiar de moneda solo cambia la unidad mostrada; no aplica tasas de cambio.</p></div><button class="button secondary" style="width:100%" data-action="close">Entendido</button>`)}
/* 15 · Form submissions (guarded against repeated taps) */
document.addEventListener('submit',async e=>{const form=e.target;if(!form.closest('#sheet'))return;e.preventDefault();if(busy)return;$('#form-error')?.replaceChildren();try{const f=new FormData(form);switch(form.id){case 'transaction-form':await registerTransaction(form);break;
case 'profile-form':{const onboarding=form.dataset.onboarding==='true',initial=form.dataset.initial==='true';const name=f.get('name')?.trim();let balance=state.settings.initialBalance,date=state.settings.initialDate;if(onboarding||initial){balance=Number(f.get('initialBalance'));if(!validNumber(balance,true))throw Error('El saldo inicial debe ser cero o un monto positivo válido.');if(state.settings.currency==='CLP'&&!Number.isInteger(balance))throw Error('Usa pesos enteros para CLP.');date=f.get('initialDate');if(!validDate(date)||date>today())throw Error('Elige una fecha válida que no sea futura.')}if(await commit(s=>{if(name!==undefined)s.settings.name=name;if(onboarding||initial){s.settings.initialBalance=balance;s.settings.initialDate=date;s.settings.onboarded=true}},'Tu espacio está listo.'))closeSheet();break}
case 'category-form':{const type=f.get('type'),name=f.get('name').trim();assert(validString(name,50),'Escribe un nombre válido.');assert(!state.categories[type].some(c=>c.toLocaleLowerCase('es')===name.toLocaleLowerCase('es')),'Ya existe una categoría con ese nombre.');if(await commit(s=>s.categories[type].push(name),'Categoría creada.'))closeSheet();break}
case 'budget-form':{const item={id:form.dataset.id||id(),category:f.get('category'),month:f.get('month'),limit:positiveAmount(f.get('limit'))};assert(!state.budgets.some(b=>b.id!==item.id&&b.category===item.category&&b.month===item.month),'Ya tienes un presupuesto de esa categoría para este mes. Edita el existente.');if(await commit(s=>{const i=s.budgets.findIndex(b=>b.id===item.id);if(i<0)s.budgets.push(item);else s.budgets[i]=item},'Presupuesto guardado.')){budgetMonth=item.month;render();closeSheet()}break}
case 'goal-form':{const item={id:form.dataset.id||id(),name:f.get('name').trim(),target:positiveAmount(f.get('target')),date:f.get('date')||''};assert(validString(item.name,80),'Escribe un nombre para tu meta.');if(item.date)assert(validDate(item.date),'Elige una fecha válida.');if(await commit(s=>{const i=s.goals.findIndex(g=>g.id===item.id);if(i<0)s.goals.push(item);else s.goals[i]=item},'Meta guardada.'))closeSheet();break}
case 'transfer-form':await manageTransfer(form);break;
case 'import-form':{const file=f.get('file');assert(file&&file.size>0&&file.size<=15*1024*1024,'Selecciona un archivo JSON de hasta 15 MB.');let raw;try{raw=JSON.parse(await file.text())}catch{throw Error('El archivo no contiene JSON válido. Tus datos siguen intactos.')}const imported=cleanImport(raw);confirmSheet('¿Reemplazar tus datos?',`La copia incluye ${imported.transactions.length} movimientos, ${imported.budgets.length} presupuestos y ${imported.goals.length} metas. Se reemplazará toda tu información actual.`,async()=>{if(await commit(s=>{Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,imported)},'Copia restaurada correctamente.')){budgetMonth=monthKey();filters={search:'',type:'all',category:'all',from:'',to:'',sort:'date-desc'};render();closeSheet()}},'Restaurar copia',true);break}
}}catch(err){const target=$('#form-error');if(target)target.textContent=err.message;else toast(err.message,true)}});
/* 16 · Delegated interaction: no decorative controls */
document.addEventListener('click',async e=>{const chart=e.target.closest('[data-chart-value]');if(chart){$('#line-tooltip').textContent=chart.dataset.chartValue;return}const cat=e.target.closest('[data-category-value]');if(cat){selectChartCategory(cat.dataset.categoryValue);return}const el=e.target.closest('[data-action]');if(!el||el.disabled||busy)return;const action=el.dataset.action;try{switch(action){case 'navigate':navigate(el.dataset.page);break;case 'transaction':openTransaction();break;case 'edit-transaction':openTransaction(el.dataset.id);break;case 'delete-transaction':deleteTransaction(el.dataset.id);break;case 'close':closeSheet();break;case 'toggle-balance':hideBalance=!hideBalance;render();break;case 'onboard':openProfile(true);break;case 'profile':openProfile();break;case 'initial':openProfile(false,true);break;case 'transaction-type':{const type=el.dataset.type;$('#transaction-form [name=type]').value=type;document.querySelectorAll('[data-action=transaction-type]').forEach(b=>{b.classList.toggle('selected',b.dataset.type===type);b.setAttribute('aria-pressed',b.dataset.type===type)});$('#tx-category').innerHTML=categoryOptions(type)+'<option value="__custom__">+ Crear categoría</option>';$('#inline-category').classList.add('hidden');$('#new-category').required=false;break}
case 'reset-filters':filters={search:'',type:'all',category:'all',from:'',to:'',sort:'date-desc'};render();break;case 'stats-period':statsPeriod=el.dataset.value;render();break;case 'chart-category':selectChartCategory(el.dataset.category);break;case 'chart-bar':$('#bar-tooltip').textContent=el.dataset.value;break;case 'budget':openBudget();break;case 'edit-budget':openBudget(el.dataset.id);break;case 'delete-budget':{const itemId=el.dataset.id;confirmSheet('¿Eliminar este presupuesto?','Solo se elimina el límite de este mes. Los movimientos se conservarán.',async()=>{if(await commit(s=>s.budgets=s.budgets.filter(b=>b.id!==itemId),'Presupuesto eliminado.'))closeSheet()},'Eliminar presupuesto',true);break}
case 'copy-budgets':await commit(s=>{state.budgets.filter(b=>b.month===monthOffset(-1,budgetMonth)).forEach(b=>s.budgets.push({...b,id:id(),month:budgetMonth}))},'Límites copiados para este mes.');break;case 'goal':openGoal();break;case 'edit-goal':openGoal(el.dataset.id);break;case 'goal-detail':openGoalDetail(el.dataset.id);break;case 'delete-goal':{const goalId=el.dataset.id;confirmSheet('¿Eliminar esta meta?',`Se eliminará la meta y su registro de aportes. Los ${money(goalBalance(goalId))} reservados volverán al saldo disponible; el saldo total no cambiará.`,async()=>{if(await commit(s=>{s.goals=s.goals.filter(g=>g.id!==goalId);s.transfers=s.transfers.filter(t=>t.goalId!==goalId)},'Meta eliminada. Dinero liberado.'))closeSheet()},'Eliminar meta',true);break}
case 'category':openCategory();break;case 'export-json':exportJSON();break;case 'export-csv':exportCSV();break;case 'import-json':openImport();break;case 'about':openAbout();break;case 'reset':confirmSheet('¿Eliminar todos tus datos?','Se borrarán movimientos, presupuestos, metas, categorías y preferencias de este dispositivo. Te recomendamos exportar una copia de seguridad antes.',()=>confirmSheet('Última confirmación','Esta acción es permanente. ¿Confirmas que quieres dejar MoneyGo completamente vacío?',async()=>{if(await commit(s=>{Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,freshState())},'Todos los datos se eliminaron.')){filters={search:'',type:'all',category:'all',from:'',to:'',sort:'date-desc'};page='home';budgetMonth=monthKey();hideBalance=false;render();closeSheet()}},'Sí, eliminar todo',true),'Continuar',true);break;case 'confirm':{const callback=confirmationCallback;confirmationCallback=null;if(callback)await callback();break}}
}catch(err){toast(err.message||'No se pudo completar la acción.',true)}});
document.addEventListener('change',async e=>{const el=e.target;const filterIds={'filter-type':'type','filter-category':'category','filter-from':'from','filter-to':'to','filter-sort':'sort'};if(filterIds[el.id]){filters[filterIds[el.id]]=el.value;renderHistoryResults();return}if(el.id==='tx-category'){$('#inline-category').classList.toggle('hidden',el.value!=='__custom__');$('#new-category').required=el.value==='__custom__'}if(el.id==='budget-month'&&/^\d{4}-(0[1-9]|1[0-2])$/.test(el.value)){budgetMonth=el.value;render()}if(['setting-theme','setting-currency','setting-animations'].includes(el.id)){const key=el.id.replace('setting-','');const value=el.type==='checkbox'?el.checked:el.value;if(key==='currency'&&value!==state.settings.currency&&(state.transactions.length||state.settings.initialBalance||state.goals.length||state.budgets.length)){const old=state.settings.currency;el.value=old;confirmSheet('Cambiar la unidad monetaria',`Todos los importes se mostrarán en ${esc(value)} conservando sus valores numéricos. No se convertirán con un tipo de cambio.`,async()=>{if(await commit(s=>s.settings.currency=value,'Moneda actualizada.'))closeSheet()},'Cambiar moneda');return}if(!await commit(s=>s.settings[key]=value,'Preferencia guardada.'))render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filters.search=e.target.value;renderHistoryResults()}});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-chart-value]');if(el&&$('#line-tooltip'))$('#line-tooltip').textContent=el.dataset.chartValue});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-chart-value],[data-category-value]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeSheet()}});
$('#sheet').addEventListener('cancel',e=>{if(busy)e.preventDefault()});
// Keep local dates current across midnight or when returning to the app.
let renderedDay=today();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&today()!==renderedDay){renderedDay=today();budgetMonth=monthKey();render()}});
const baseRender=render;render=function(){baseRender();if(page==='transactions')renderHistoryResults()};
/* 17 · Boot: fail safely if persistent storage is not available */
(async()=>{try{await openStorage();const saved=await loadState();if(saved)state=cleanImport(saved);storageReady=true;applyTheme();render()}catch(err){applyTheme();render();storageError('No pudimos abrir tus datos: '+(err.message||'almacenamiento no disponible')+' No registres movimientos hasta resolverlo. Prueba en una pestaña normal con almacenamiento habilitado.')}})();
</script>
